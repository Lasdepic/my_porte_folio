<section class="mt-28 px-6" aria-labelledby="nabu-title">
  <div class="mx-auto max-w-5xl">
    <a
      class="inline-flex items-center rounded-full border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:border-indigo-300 hover:text-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2"
      routerLink="/"
    >
      Retour
    </a>

    <div class="mt-6 rounded-xl border border-gray-200 bg-white p-6 shadow-md">
      <h1 id="nabu-title" class="text-3xl font-semibold tracking-tight text-gray-900">
        Nabu
      </h1>
      <p class="mt-2 text-sm text-gray-600">
        Page de présentation du projet (frontend + backend séparés).
      </p>

      <div class="mt-6 grid gap-6 md:grid-cols-3">
        <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
          <h2 class="text-base font-semibold text-gray-900">Contexte</h2>
          <p class="mt-2 text-sm leading-relaxed text-gray-600">
            Décris ici le besoin, l’objectif du projet et ton rôle.
          </p>
        </section>

        <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
          <h2 class="text-base font-semibold text-gray-900">Fonctionnalités</h2>
          <ul class="mt-2 space-y-2 text-sm text-gray-600">
            <li>• À compléter</li>
            <li>• À compléter</li>
            <li>• À compléter</li>
          </ul>
        </section>

        <section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
          <h2 class="text-base font-semibold text-gray-900">Repos GitHub</h2>
          <div class="mt-3 flex flex-col gap-3">
            <a
              class="inline-flex items-center justify-center rounded-full bg-gray-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2"
              [href]="frontendRepoUrl"
              target="_blank"
              rel="noreferrer"
            >
              Frontend
            </a>
            <a
              class="inline-flex items-center justify-center rounded-full border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm transition-colors hover:border-indigo-300 hover:text-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2"
              [href]="backendRepoUrl"
              target="_blank"
              rel="noreferrer"
            >
              Backend
            </a>
          </div>
        </section>
      </div>
    </div>
  </div>
</section>
