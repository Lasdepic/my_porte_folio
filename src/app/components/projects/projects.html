<section class="mt-16 px-6" aria-labelledby="projects-title" id="projects">
	<div class="mx-auto max-w-5xl">
		<div class="rounded-xl border border-gray-200 bg-white p-6 shadow-md">
			<h2 id="projects-title" class="text-2xl font-semibold tracking-tight text-gray-900">
				Projets
			</h2>
			<p class="mt-2 text-sm text-gray-600">
				Une sélection de projets disponibles sur GitHub.
			</p>

			<div class="mt-6 grid gap-6 md:grid-cols-2">
				@for (project of projects; track project.detailsUrl) {
					<article
						class="group relative rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition-colors hover:border-indigo-300"
						aria-label="{{ project.name }}"
					>
						<div class="flex items-start justify-between gap-3">
							<h3 class="text-base font-semibold text-gray-900">
								{{ project.name }}
							</h3>
							<span
								class="shrink-0 rounded-full border border-gray-200 bg-white px-2.5 py-1 text-xs font-medium text-gray-700"
							>
								{{ project.scopeLabel }}
							</span>
						</div>

						<p class="mt-3 text-sm leading-relaxed text-gray-600">
							{{ project.tagline }}
						</p>

						<div class="mt-5">
							<a
								class="inline-flex items-center justify-center rounded-full bg-gray-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2"
								[routerLink]="project.detailsUrl"
							>
								Découvrir le projet
							</a>
						</div>
					</article>
				}
			</div>
		</div>
	</div>
</section>
