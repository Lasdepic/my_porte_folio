<section class="mt-16 px-6" aria-labelledby="softskills-title">
  <div class="mx-auto max-w-5xl">
    <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-md">
      <h2 id="softskills-title" class="text-2xl font-semibold tracking-tight text-gray-900">
        Soft Skills
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Compétences humaines et professionnelles développées au fil des expériences.
      </p>

      <div class="mt-6 grid gap-6 md:grid-cols-2">
        @for (skill of skills; track skill.label) {
          <div class="group inline-flex items-center gap-4 rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition-colors hover:border-indigo-300">
       <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-indigo-50 text-indigo-600"
     [innerHTML]="skill.icon">
</div>
            <div>
              <p class="text-sm font-semibold text-gray-800 group-hover:text-indigo-700">{{ skill.label }}</p>
              <p class="text-xs text-gray-400">{{ skill.description }}</p>
            </div>
          </div>
        }
      </div>

    </div>
  </div>
</section>
