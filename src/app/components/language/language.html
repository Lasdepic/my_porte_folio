
<section class="mt-16 px-6" aria-labelledby="skills-title">
	<div class="mx-auto max-w-5xl">
		<div class="rounded-xl border border-gray-200 bg-white p-6 shadow-md">
			<h2 id="skills-title" class="text-2xl font-semibold tracking-tight text-gray-900">
				Technologies
			</h2>
			<p class="mt-2 text-sm text-gray-600">
				Langages, frameworks et outils que j’utilise au quotidien.
			</p>

			<div class="mt-6 grid gap-6 md:grid-cols-2">
				@for (category of categories; track category.title) {
					<section class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm" aria-label="{{ category.title }}">
						<h3 class="text-base font-semibold text-gray-900">{{ category.title }}</h3>

						<ul class="mt-4 flex flex-wrap gap-3">
							@for (item of category.items; track item.name) {
								<li>
									<div
										class="group inline-flex items-center gap-2 rounded-full border border-gray-200 bg-white px-3 py-2 text-sm text-gray-700 shadow-sm transition-colors hover:border-indigo-300 hover:text-indigo-700"
									>
										<img
											[src]="item.iconSrc"
											width="20"
											height="20"
											alt=""
											class="h-5 w-5"
										/>
										<span class="font-medium">{{ item.name }}</span>
									</div>
								</li>
							}
						</ul>
					</section>
				}
			</div>
		</div>
	</div>
</section>
